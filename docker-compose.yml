services:
  php:
    build: .
    container_name: escale_php
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - mongo

  nginx:
    image: nginx:latest
    container_name: escale_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: escale_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voyages
      MYSQL_USER: voyages
      MYSQL_PASSWORD: voyages
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: escale_phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit:latest
    container_name: escale_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  mongo:
    image: mongo:7
    container_name: escale_mongo
    environment:
      MONGO_INITDB_DATABASE: escale
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: escale_mongo_express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8082:8081"
    depends_on:
      - mongo

volumes:
  mysql_data:
  mongo_data:
