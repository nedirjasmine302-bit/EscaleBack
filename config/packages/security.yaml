security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Un admin hérite des droits d'un employé, qui hérite des droits d'un membre
    role_hierarchy:
        ROLE_EMPLOYEE: ROLE_USER
        ROLE_ADMIN: ROLE_EMPLOYEE

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # Inscription et connexion accessibles sans être connecté
        - { path: ^/api/sign-up, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/sign-in, methods: [POST], roles: PUBLIC_ACCESS }

        # Mot de passe oublié accessible sans être connecté
        - { path: ^/api/auth/forgot-password, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password, methods: [POST], roles: PUBLIC_ACCESS }

        # Vérification d'unicité email / pseudo accessible sans être connecté
        - { path: ^/api/check-email, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/check-pseudo, methods: [GET], roles: PUBLIC_ACCESS }

        # Consultation du catalogue en lecture seule accessible aux visiteurs
        - { path: ^/api/destinations, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/categories, methods: [GET], roles: PUBLIC_ACCESS }

        # Envoi d'une demande de contact accessible aux visiteurs
        - { path: ^/api/requests, methods: [POST], roles: PUBLIC_ACCESS }

        # Le reste des /api nécessite un jeton JWT valide
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
