services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    environment:
      APP_ENV: prod
      PORT: 8080
    depends_on:
      - mysql
      - mongo

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: voyages
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
